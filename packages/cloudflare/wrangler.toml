# LudKey Hunter — Cloudflare Worker coordinator for puzzle #72.
#
# Deploy to YOUR OWN Cloudflare account (free plan is enough):
#   1. npm i -g wrangler        # one time
#   2. wrangler login           # opens your browser, authorizes
#   3. wrangler deploy          # prints your public URL
#
# The URL it prints (https://ludkey-hunter.<you>.workers.dev) is the single
# link you open on every device — phone and PCs — to search together. No home
# machine stays on; the coordinator lives on Cloudflare's edge.

name = "ludkey-hunter"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# The web app is embedded in the Worker (src/app.js) and served from "/", so
# there is NO static-asset layer in front of the Worker — every request,
# including /api/*, is handled by the Worker directly.

# The coordinator is one Durable Object instance holding the shared allocator
# state, so leasing chunks is atomic across all devices.
[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "Coordinator"

# SQLite-backed Durable Objects are available on the FREE Workers plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Coordinator"]

# Segment size is PINNED to 2^25 to match the grid used by every agent
# (CUDA standalone, the Go agent, and offline mode all index segments as
# 2^71 + idx*2^25). This must stay 25 so a fresh Durable Object (after any
# state reset) re-initialises on the SAME grid as the existing progress and
# the agents — otherwise imported/offline indices would point at the wrong
# chunks and create gaps in the #72 accounting. Fast GPUs stay inside the
# free-tier request budget via batch lease/complete, not via a bigger chunk.
[vars]
CHUNK_BITS = "25"
