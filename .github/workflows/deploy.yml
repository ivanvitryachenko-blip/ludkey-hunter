name: Deploy coordinator to Cloudflare

# Deploys the Cloudflare Worker coordinator with `wrangler deploy`, which
# publishes the new version at 100% traffic immediately (no gradual rollout) —
# this is what makes a push actually take effect, unlike the dashboard's
# git-build gradual deployments that left traffic on an old version.
#
# One-time setup: add a repository secret CLOUDFLARE_API_TOKEN
# (Settings -> Secrets and variables -> Actions). Create the token in the
# Cloudflare dashboard with the "Edit Cloudflare Workers" template.

on:
  push:
    branches: [main]
    paths:
      - "packages/cloudflare/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "410de824a279cbdd1c7ec89da1b45fc5"
          workingDirectory: "packages/cloudflare"
          wranglerVersion: "3.99.0"
          command: deploy
      - name: Verify the live deployment
        run: |
          BASE="https://ludkey-hunter.8jt6mh8rz9.workers.dev"
          sleep 6
          echo "=== GET /api/info ==="
          curl -fsS "$BASE/api/info" ; echo
          echo "=== POST /api/register ==="
          REG=$(curl -fsS -X POST -H 'content-type: application/json' -d '{"type":"ci","name":"ci-probe"}' "$BASE/api/register"); echo "$REG"
          TOKEN=$(printf '%s' "$REG" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          echo "=== POST /api/lease (auth) ==="
          curl -fsS -X POST -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{}' "$BASE/api/lease" ; echo
          echo "=== GET / (first 120 chars) ==="
          curl -fsS "$BASE/" | head -c 120 ; echo
          echo "=== security headers on / ==="
          H=$(curl -fsSI "$BASE/")
          echo "$H" | grep -iq "content-security-policy"      || { echo "MISSING CSP"; exit 1; }
          echo "$H" | grep -iq "strict-transport-security"    || { echo "MISSING HSTS"; exit 1; }
          echo "$H" | grep -iq "x-frame-options: *deny"       || { echo "MISSING X-Frame-Options"; exit 1; }
          echo "$H" | grep -iq "x-content-type-options: *nosniff" || { echo "MISSING nosniff"; exit 1; }
          echo "security headers present"
          echo "=== input validation: bad chunkIndex must be 400 ==="
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"chunkIndex":"abc"}' "$BASE/api/complete")
          [ "$CODE" = "400" ] || { echo "expected 400 for bad chunkIndex, got $CODE"; exit 1; }
          echo "bad chunkIndex -> 400 OK"
          echo "VERIFY-OK"
